<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>True Baboons</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #696a6d;
      display: flex;
      justify-content: center;
      background-color: #ebede9;
      padding: min(5vw,3rem);
    }
    .container {
      width: min(90vw, 1200px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }
    .logo {
      margin-top: clamp(0.5rem, 5vw, 2rem);
    }
    .logo img, .game img {
      width: 100%;
      height: auto;
    }
    .header {
      width: 100%;
      display: flex;
      flex-flow: row wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    h2 {
      font-size: clamp(1rem, 5vw, 2rem);
      margin: 0;
    }
    .steam, .game{
      margin-top: clamp(0.5rem, 5vw, 1rem);
      width: 100%;
      display: flex;
      justify-content: center;  
    }
    .game {
      padding: 1.1%;
      background-color: black;
      box-sizing: border-box  
    }
    .steam iframe {
      width: 90%;
      max-width: 700px;
    }
    .game iframe{
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    .contact {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: clamp(0.5rem, 2.5vw, 1rem);
      white-space: nowrap;
    }
    .contact img {
      height: clamp(2rem, 5vw, 3rem);
      width: auto;
      display: block;
    }
    .contact a {
      display: flex;
      align-items: center;
    }
    a {
      color: inherit;          /* Use parent’s text colour */
      text-decoration: none;   /* Optional: remove underline */
    }

    a:visited,
    a:hover,
    a:active {
      color: inherit;          /* Keep it consistent in all states */
    }
      </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h2>True Baboons Game Studio</h2>
      <div class="contact">
        <a href="https://bsky.app/profile/patrickbeer.bsky.social" target="_blank" title="Bluesky">
          <img src="assets/bluesky_icon.png" alt="Bluesky" />
        </a>
        <a href="" target="_blank" title="LinkedIn"> /* https://www.linkedin.com/in/patrick-beer/ */
          <img src="assets/linked_in_icon.png" alt="LinkedIn" />
        </a>
        <div class="e-mail">
          Patrick Beer<br>
          <script>
            const user = "patrick";
            const domain = "truebaboons.com";
            document.write(`<a href="mailto:${user}@${domain}">${user}@${domain}</a>`);
          </script>
        </div>
      </div>
    </div>

    <div class="logo">
      <img src="assets/true_baboons_logo.png" alt="True Baboons Logo" />
    </div>

    <div class="steam">
      <iframe src="https://store.steampowered.com/widget/3623200/" frameborder="0" width="646" height="190"></iframe>
    </div>

    <div class="game">
      <iframe src="https://www.youtube-nocookie.com/embed/gmEIGLZZX5E?loop=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

  </div>

</body>
</html>
